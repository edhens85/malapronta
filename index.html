<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Milhas & Assinaturas</title>
  <style>
    :root {
      --bg-app: #0b1020;
      --bg-sidebar: #111827;
      --bg-card: #151e32;
      --bg-card-hover: #1b2740;
      --bg-ticker: #0d1326;
      --border: #243049;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP TICKER BAR */
    .top-ticker {
      background-color: var(--bg-ticker);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .ticker-track {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .ticker-track::-webkit-scrollbar {
      display: none;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      line-height: 1;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 12px;
      height: 28px;
    }

    .ticker-label {
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
    }

    .ticker-value {
      color: var(--text-primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
    }

    .ticker-delta {
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
    }

    .delta-up { color: var(--success); }
    .delta-down { color: var(--danger); }

    /* TOP RIGHT BELL & ALERTS */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      flex-shrink: 0;
    }

    .bell-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .bell-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
    }

    .bell-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .alerts-dropdown {
      display: none;
      position: absolute;
      top: 40px;
      right: 0;
      width: 360px;
      max-width: calc(100vw - 24px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
      z-index: 60;
      overflow: hidden;
    }

    .alerts-dropdown.open {
      display: block;
    }

    .alerts-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .alerts-list {
      max-height: 340px;
      overflow-y: auto;
    }

    .alert-row {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(36, 48, 73, 0.6);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .alert-row:last-child {
      border-bottom: none;
    }

    .alert-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .alert-tag {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .tag-clube {
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
    }

    .tag-milhas {
      background: rgba(245, 158, 11, 0.16);
      color: var(--warning);
    }

    .alert-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* MAIN LAYOUT */
    .layout {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 44px);
    }

    /* SIDEBAR: TUDO EM CAIXA ALTA */
    .sidebar {
      width: 250px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .sidebar,
    .sidebar * {
      text-transform: uppercase;
    }

    .nav-item,
    .nav-group-btn,
    .nav-sub-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .nav-item:hover,
    .nav-group-btn:hover,
    .nav-sub-item:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .nav-item.active,
    .nav-sub-item.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* SUBMENU RELATÓRIOS: RETRAÍDO POR PADRÃO */
    .nav-group-submenu {
      display: none;
      flex-direction: column;
      gap: 4px;
      padding-left: 14px;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    .nav-group-submenu.expanded {
      display: flex;
    }

    .nav-sub-item {
      padding: 8px 12px;
      font-size: 11px;
    }

    .chevron {
      transition: transform 0.2s ease;
      font-size: 11px;
    }

    .nav-group-btn[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    /* CONTENT AREA */
    .content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .card-value {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .expiry-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.14);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .num {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <!-- TICKER SUPERIOR ALINHADO + 2 COTAÇÕES LIVELO -->
  <header class="top-ticker" aria-label="Cotações e indicadores">
    <div class="ticker-track" id="tickerTrack"></div>

    <div class="top-actions">
      <button
        type="button"
        class="bell-btn"
        id="bellBtn"
        aria-label="Alertas de vencimento"
        aria-expanded="false"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="bell-badge" id="bellCount">0</span>
      </button>

      <div class="alerts-dropdown" id="alertsDropdown" role="region" aria-label="Notificações de vencimento">
        <div class="alerts-header">
          <span>Alertas de Vencimento</span>
          <span id="alertsSummaryCount">0 itens</span>
        </div>
        <div class="alerts-list" id="alertsList"></div>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- MENU LATERAL EM CAIXA ALTA + RELATÓRIOS RETRAÍDO -->
    <aside class="sidebar" aria-label="Menu principal">
      <button type="button" class="nav-item active" data-route="dashboard">
        <span class="nav-left">Dashboard</span>
      </button>

      <button type="button" class="nav-item" data-route="programas">
        <span class="nav-left">Programas</span>
      </button>

      <button type="button" class="nav-item" data-route="clubes">
        <span class="nav-left">Clubes &amp; Assinaturas</span>
      </button>

      <!-- GRUPO RELATÓRIOS: RETRAÍDO POR PADRÃO -->
      <div class="nav-group">
        <button
          type="button"
          class="nav-group-btn"
          id="relatoriosToggle"
          aria-expanded="false"
          aria-controls="relatoriosSubmenu"
        >
          <span class="nav-left">Relatórios</span>
          <span class="chevron" aria-hidden="true">▼</span>
        </button>

        <div class="nav-group-submenu" id="relatoriosSubmenu">
          <button type="button" class="nav-sub-item" data-route="relatorios-rota-emissao">
            Rota de emissão
          </button>
          <button type="button" class="nav-sub-item" data-route="relatorios-passagens">
            Passagens
          </button>
          <button type="button" class="nav-sub-item" data-route="relatorios-emitidos">
            Emitidos
          </button>
          <button type="button" class="nav-sub-item" data-route="relatorios-movimentos">
            Movimentos
          </button>
        </div>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="content">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="pageTitle">Visão Geral</h1>
          <p class="page-subtitle" id="pageSubtitle">Saldos, vencimentos programados e cotações</p>
        </div>
      </div>

      <!-- CARDS DE VENCIMENTO DE MILHAS (SEM 'K' E SEM 'PONTOS/MILHAS') -->
      <section class="cards-grid" id="expiryCardsGrid"></section>

      <!-- TABELA DE CLUBES / ASSINATURAS E VENCIMENTOS -->
      <section class="section-card">
        <h2 class="section-title">Clubes &amp; Assinaturas Programadas</h2>
        <table>
          <thead>
            <tr>
              <th>Assinatura / Clube</th>
              <th>Tipo</th>
              <th>Próximo Vencimento</th>
              <th>Dias Restantes</th>
            </tr>
          </thead>
          <tbody id="subscriptionsTableBody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script>
    const MS_PER_DAY = 1000 * 60 * 60 * 24;
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);

    function addDays(days) {
      const d = new Date(TODAY);
      d.setDate(d.getDate() + days);
      return d;
    }

    function diffDaysFromToday(dateObj) {
      const target = new Date(dateObj);
      target.setHours(0, 0, 0, 0);
      return Math.round((target - TODAY) / MS_PER_DAY);
    }

    function formatDatePtBr(dateObj) {
      return new Date(dateObj).toLocaleDateString("pt-BR");
    }

    // Formata número inteiro mantendo ponto de milhar, sem 'K' e sem sufixo 'pontos/milhas'
    function formatMilharSemK(valor) {
      return Math.round(Number(valor) || 0).toLocaleString("pt-BR");
    }

    // Ticker superior: alinhado e com as 2 cotações da Livelo restauradas
    const tickerItems = [
      { label: "Livelo Compra", value: "R$ 35,00", delta: "+1,4%", up: true },
      { label: "Livelo Venda", value: "R$ 38,50", delta: "-0,6%", up: false },
      { label: "LATAM Pass", value: "R$ 26,80", delta: "+0,8%", up: true },
      { label: "Azul", value: "R$ 22,40", delta: "+0,3%", up: true },
      { label: "Smiles", value: "R$ 18,90", delta: "-0,4%", up: false }
    ];

    // Vencimentos de milhas (exemplos com 30 e 90 dias; ajuste conforme seus dados reais)
    const mileExpirations = [
      { id: "m-1", program: "LATAM Pass", amount: 45200, days: 30 },
      { id: "m-2", program: "Azul Fidelidade", amount: 128500, days: 90 },
      { id: "m-3", program: "Smiles", amount: 18400, days: 90 }
    ];

    // Clubes e assinaturas já cadastrados/programados (incluídos nos alertas do sino)
    const subscriptions = [
      {
        id: "sub-1",
        name: "Clube Livelo 10.000",
        category: "clube",
        dueDate: addDays(12),
        alertWindowDays: 30
      },
      {
        id: "sub-2",
        name: "ALL Signature Discover",
        category: "assinatura",
        dueDate: addDays(21),
        alertWindowDays: 30
      },
      {
        id: "sub-3",
        name: "Clube LATAM Pass 5.000",
        category: "clube",
        dueDate: addDays(45),
        alertWindowDays: 30
      }
    ];

    function renderTicker() {
      const track = document.getElementById("tickerTrack");
      track.innerHTML = tickerItems
        .map(
          (item) => `
            <div class="ticker-item">
              <span class="ticker-label">${item.label}</span>
              <span class="ticker-value">${item.value}</span>
              <span class="ticker-delta ${item.up ? "delta-up" : "delta-down"}">${item.delta}</span>
            </div>
          `
        )
        .join("");
    }

    function renderMileExpiryCards() {
      const grid = document.getElementById("expiryCardsGrid");
      grid.innerHTML = mileExpirations
        .map(
          (item) => `
            <article class="card">
              <span class="card-label">${item.program}</span>
              <div class="card-value">${formatMilharSemK(item.amount)}</div>
              <span class="expiry-badge">Vence em ${item.days} dias</span>
            </article>
          `
        )
        .join("");
    }

    function getUpcomingSubscriptionAlerts() {
      return subscriptions
        .map((sub) => ({
          ...sub,
          daysLeft: diffDaysFromToday(sub.dueDate)
        }))
        .filter((sub) => sub.daysLeft >= 0 && sub.daysLeft <= sub.alertWindowDays)
        .sort((a, b) => a.daysLeft - b.daysLeft);
    }

    function renderAlertsBell() {
      const subAlerts = getUpcomingSubscriptionAlerts();
      const mileAlerts = mileExpirations
        .filter((m) => m.days <= 90)
        .map((m) => ({
          id: m.id,
          title: `${m.program} — ${formatMilharSemK(m.amount)}`,
          tag: "milhas",
          metaText: `Vence em ${m.days} dias`
        }));

      const formattedSubAlerts = subAlerts.map((s) => ({
        id: s.id,
        title: `${s.name} — vence em ${formatDatePtBr(s.dueDate)}`,
        tag: "clube",
        metaText: s.daysLeft === 0 ? "Vence hoje" : `Vence em ${s.daysLeft} dias`
      }));

      const allAlerts = [...formattedSubAlerts, ...mileAlerts];
      const badge = document.getElementById("bellCount");
      const summary = document.getElementById("alertsSummaryCount");
      const list = document.getElementById("alertsList");

      badge.textContent = String(allAlerts.length);
      summary.textContent = `${allAlerts.length} ${allAlerts.length === 1 ? "item" : "itens"}`;

      if (allAlerts.length === 0) {
        list.innerHTML = `<div class="alert-row"><span class="alert-title">Nenhum vencimento próximo.</span></div>`;
        return;
      }

      list.innerHTML = allAlerts
        .map(
          (alert) => `
            <div class="alert-row">
              <div class="alert-meta">
                <span class="alert-tag ${alert.tag === "clube" ? "tag-clube" : "tag-milhas"}">
                  ${alert.tag === "clube" ? "Clube / Assinatura" : "Milhas"}
                </span>
                <span>${alert.metaText}</span>
              </div>
              <div class="alert-title">${alert.title}</div>
            </div>
          `
        )
        .join("");
    }

    function renderSubscriptionsTable() {
      const tbody = document.getElementById("subscriptionsTableBody");
      tbody.innerHTML = subscriptions
        .map((sub) => {
          const daysLeft = diffDaysFromToday(sub.dueDate);
          return `
            <tr>
              <td>${sub.name}</td>
              <td>${sub.category}</td>
              <td>${formatDatePtBr(sub.dueDate)}</td>
              <td class="num">Vence em ${daysLeft} dias</td>
            </tr>
          `;
        })
        .join("");
    }

    // Toggle do menu Relatórios (começa retraído por padrão)
    const relatoriosToggle = document.getElementById("relatoriosToggle");
    const relatoriosSubmenu = document.getElementById("relatoriosSubmenu");

    relatoriosToggle.addEventListener("click", () => {
      const isExpanded = relatoriosToggle.getAttribute("aria-expanded") === "true";
      const nextState = !isExpanded;
      relatoriosToggle.setAttribute("aria-expanded", String(nextState));
      relatoriosSubmenu.classList.toggle("expanded", nextState);
    });

    // Seleção de rota no menu lateral
    const routeTitles = {
      "dashboard": "Visão Geral",
      "programas": "Programas de Fidelidade",
      "clubes": "Clubes & Assinaturas",
      "relatorios-rota-emissao": "Relatórios — Rota de Emissão",
      "relatorios-passagens": "Relatórios — Passagens",
      "relatorios-emitidos": "Relatórios — Emitidos",
      "relatorios-movimentos": "Relatórios — Movimentos"
    };

    document.querySelectorAll("[data-route]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-item, .nav-sub-item").forEach((el) => {
          el.classList.remove("active");
        });
        btn.classList.add("active");
        const route = btn.getAttribute("data-route");
        document.getElementById("pageTitle").textContent = routeTitles[route] || "Visão Geral";
      });
    });

    // Dropdown do sininho no canto superior direito
    const bellBtn = document.getElementById("bellBtn");
    const alertsDropdown = document.getElementById("alertsDropdown");

    bellBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const isOpen = alertsDropdown.classList.toggle("open");
      bellBtn.setAttribute("aria-expanded", String(isOpen));
    });

    document.addEventListener("click", (event) => {
      if (!alertsDropdown.contains(event.target) && !bellBtn.contains(event.target)) {
        alertsDropdown.classList.remove("open");
        bellBtn.setAttribute("aria-expanded", "false");
      }
    });

    renderTicker();
    renderMileExpiryCards();
    renderAlertsBell();
    renderSubscriptionsTable();
  </script>
</body>
</html>
