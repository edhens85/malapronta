<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Milhas & Assinaturas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #f5f6f8;
      --bg-surface: #ffffff;
      --bg-subtle: #f9fafb;
      --bg-hover: #f1f3f5;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --accent: #0f4c81;
      --accent-bg: #eef5fc;
      --accent-border: #bfdbfe;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --warning: #b45309;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP BAR: TICKER + SINO */
    .topbar {
      height: 44px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 24px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .ticker-list {
      display: flex;
      align-items: center;
      gap: 20px;
      overflow-x: auto;
      scrollbar-width: none;
      height: 100%;
    }

    .ticker-list::-webkit-scrollbar {
      display: none;
    }

    .ticker-cell {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1;
      height: 24px;
    }

    .ticker-name {
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .ticker-price {
      color: var(--text-primary);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .ticker-change {
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .is-up { color: var(--success); }
    .is-down { color: var(--danger); }

    .ticker-divider {
      width: 1px;
      height: 14px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* SINO E DROPDOWN */
    .alerts-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .bell-trigger {
      position: relative;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .bell-trigger:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .bell-count {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--danger);
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .alerts-panel {
      display: none;
      position: absolute;
      top: 40px;
      right: 0;
      width: 360px;
      max-width: calc(100vw - 24px);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(17, 24, 39, 0.12), 0 4px 10px -2px rgba(17, 24, 39, 0.06);
      z-index: 60;
      overflow: hidden;
    }

    .alerts-panel.open {
      display: block;
    }

    .alerts-panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .alerts-panel-body {
      max-height: 340px;
      overflow-y: auto;
    }

    .alert-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .alert-item:last-child {
      border-bottom: none;
    }

    .alert-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }

    .alert-badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 10px;
    }

    .badge-clube {
      background: var(--accent-bg);
      color: var(--accent);
    }

    .badge-milhas {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .alert-days {
      color: var(--text-muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .alert-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* SHELL PRINCIPAL */
    .app-shell {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 44px);
    }

    /* SIDEBAR: TUDO CAIXA ALTA */
    .sidebar {
      width: 248px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .sidebar,
    .sidebar * {
      text-transform: uppercase;
    }

    .menu-btn,
    .group-trigger,
    .submenu-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .menu-btn:hover,
    .group-trigger:hover,
    .submenu-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .menu-btn.active,
    .submenu-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
    }

    /* SUBMENU RELATÓRIOS: RETRAÍDO POR PADRÃO */
    .submenu {
      display: none;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
      margin-bottom: 4px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
      margin-left: 12px;
    }

    .submenu.open {
      display: flex;
    }

    .submenu-btn {
      padding: 8px 10px;
      font-size: 11px;
    }

    .caret {
      font-size: 10px;
      color: var(--text-muted);
      transition: transform 0.18s ease;
    }

    .group-trigger[aria-expanded="true"] .caret {
      transform: rotate(180deg);
    }

    /* ÁREA DE CONTEÚDO */
    .main-area {
      flex: 1;
      padding: 28px 32px;
      max-width: 1280px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .main-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.015em;
    }

    .main-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* CARDS DE VENCIMENTO */
    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .metric-program {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-number {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .due-pill {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid var(--warning-border);
      font-variant-numeric: tabular-nums;
    }

    /* TABELA DE ASSINATURAS / CLUBES */
    .table-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .table-card-head {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      padding: 10px 20px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 12px 20px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover td {
      background: var(--bg-subtle);
    }

    .td-muted {
      color: var(--text-secondary);
      text-transform: capitalize;
    }

    .td-num {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    @media (max-width: 820px) {
      .app-shell {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .main-area {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="ticker-list" id="tickerList"></div>

    <div class="alerts-wrap">
      <button
        type="button"
        class="bell-trigger"
        id="bellTrigger"
        aria-label="Alertas de vencimento"
        aria-expanded="false"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="bell-count" id="bellCount">0</span>
      </button>

      <div class="alerts-panel" id="alertsPanel" role="region" aria-label="Alertas de vencimento">
        <div class="alerts-panel-header">
          <span>Alertas de Vencimento</span>
          <span id="alertsPanelTotal">0 itens</span>
        </div>
        <div class="alerts-panel-body" id="alertsPanelBody"></div>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <button type="button" class="menu-btn active" data-route="dashboard">
        <span>Dashboard</span>
      </button>

      <button type="button" class="menu-btn" data-route="programas">
        <span>Programas</span>
      </button>

      <button type="button" class="menu-btn" data-route="clubes">
        <span>Clubes &amp; Assinaturas</span>
      </button>

      <div>
        <button
          type="button"
          class="group-trigger"
          id="relatoriosBtn"
          aria-expanded="false"
          aria-controls="relatoriosMenu"
        >
          <span>Relatórios</span>
          <span class="caret" aria-hidden="true">▼</span>
        </button>

        <div class="submenu" id="relatoriosMenu">
          <button type="button" class="submenu-btn" data-route="relatorios-rota-emissao">
            Rota de emissão
          </button>
          <button type="button" class="submenu-btn" data-route="relatorios-passagens">
            Passagens
          </button>
          <button type="button" class="submenu-btn" data-route="relatorios-emitidos">
            Emitidos
          </button>
          <button type="button" class="submenu-btn" data-route="relatorios-movimentos">
            Movimentos
          </button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <div class="header-row">
        <div>
          <h1 class="main-title" id="mainTitle">Visão Geral</h1>
          <p class="main-subtitle" id="mainSubtitle">Vencimentos programados, assinaturas e cotações</p>
        </div>
      </div>

      <section class="cards-row" id="expiryCards"></section>

      <section class="table-card">
        <div class="table-card-head">Clubes &amp; Assinaturas Programadas</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Assinatura / Clube</th>
                <th>Tipo</th>
                <th>Vencimento</th>
                <th>Prazo</th>
              </tr>
            </thead>
            <tbody id="subscriptionsBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const MS_PER_DAY = 1000 * 60 * 60 * 24;
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);

    function addDays(days) {
      const d = new Date(TODAY);
      d.setDate(d.getDate() + days);
      return d;
    }

    function diffDaysFromToday(dateObj) {
      const target = new Date(dateObj);
      target.setHours(0, 0, 0, 0);
      return Math.round((target - TODAY) / MS_PER_DAY);
    }

    function formatDatePtBr(dateObj) {
      return new Date(dateObj).toLocaleDateString("pt-BR");
    }

    function formatMilharSemK(valor) {
      return Math.round(Number(valor) || 0).toLocaleString("pt-BR");
    }

    const tickerItems = [
      { label: "Livelo Compra", value: "R$ 35,00", delta: "+1,4%", up: true },
      { label: "Livelo Venda", value: "R$ 38,50", delta: "-0,6%", up: false },
      { label: "LATAM Pass", value: "R$ 26,80", delta: "+0,8%", up: true },
      { label: "Azul", value: "R$ 22,40", delta: "+0,3%", up: true },
      { label: "Smiles", value: "R$ 18,90", delta: "-0,4%", up: false }
    ];

    const mileExpirations = [
      { id: "m-1", program: "LATAM Pass", amount: 45200, days: 30 },
      { id: "m-2", program: "Azul Fidelidade", amount: 128500, days: 90 },
      { id: "m-3", program: "Smiles", amount: 18400, days: 90 }
    ];

    const subscriptions = [
      {
        id: "sub-1",
        name: "Clube Livelo 10.000",
        category: "clube",
        dueDate: addDays(12),
        alertWindowDays: 30
      },
      {
        id: "sub-2",
        name: "ALL Signature Discover",
        category: "assinatura",
        dueDate: addDays(21),
        alertWindowDays: 30
      },
      {
        id: "sub-3",
        name: "Clube LATAM Pass 5.000",
        category: "clube",
        dueDate: addDays(45),
        alertWindowDays: 30
      }
    ];

    function renderTicker() {
      const list = document.getElementById("tickerList");
      list.innerHTML = tickerItems
        .map(
          (item, idx) => `
            ${idx > 0 ? '<span class="ticker-divider" aria-hidden="true"></span>' : ""}
            <div class="ticker-cell">
              <span class="ticker-name">${item.label}</span>
              <span class="ticker-price">${item.value}</span>
              <span class="ticker-change ${item.up ? "is-up" : "is-down"}">${item.delta}</span>
            </div>
          `
        )
        .join("");
    }

    function renderExpiryCards() {
      const container = document.getElementById("expiryCards");
      container.innerHTML = mileExpirations
        .map(
          (item) => `
            <article class="metric-card">
              <span class="metric-program">${item.program}</span>
              <div class="metric-number">${formatMilharSemK(item.amount)}</div>
              <span class="due-pill">Vence em ${item.days} dias</span>
            </article>
          `
        )
        .join("");
    }

    function getUpcomingSubscriptionAlerts() {
      return subscriptions
        .map((sub) => ({
          ...sub,
          daysLeft: diffDaysFromToday(sub.dueDate)
        }))
        .filter((sub) => sub.daysLeft >= 0 && sub.daysLeft <= sub.alertWindowDays)
        .sort((a, b) => a.daysLeft - b.daysLeft);
    }

    function renderAlertsPanel() {
      const subAlerts = getUpcomingSubscriptionAlerts().map((s) => ({
        id: s.id,
        tag: "clube",
        daysLabel: s.daysLeft === 0 ? "Vence hoje" : `Vence em ${s.daysLeft} dias`,
        title: `${s.name} — ${formatDatePtBr(s.dueDate)}`
      }));

      const mileAlerts = mileExpirations
        .filter((m) => m.days <= 90)
        .map((m) => ({
          id: m.id,
          tag: "milhas",
          daysLabel: `Vence em ${m.days} dias`,
          title: `${m.program} — ${formatMilharSemK(m.amount)}`
        }));

      const all = [...subAlerts, ...mileAlerts];
      document.getElementById("bellCount").textContent = String(all.length);
      document.getElementById("alertsPanelTotal").textContent = `${all.length} ${all.length === 1 ? "item" : "itens"}`;

      const body = document.getElementById("alertsPanelBody");
      if (all.length === 0) {
        body.innerHTML = `<div class="alert-item"><span class="alert-text">Nenhum vencimento próximo.</span></div>`;
        return;
      }

      body.innerHTML = all
        .map(
          (a) => `
            <div class="alert-item">
              <div class="alert-top">
                <span class="alert-badge ${a.tag === "clube" ? "badge-clube" : "badge-milhas"}">
                  ${a.tag === "clube" ? "Clube / Assinatura" : "Milhas"}
                </span>
                <span class="alert-days">${a.daysLabel}</span>
              </div>
              <div class="alert-text">${a.title}</div>
            </div>
          `
        )
        .join("");
    }

    function renderSubscriptionsTable() {
      const tbody = document.getElementById("subscriptionsBody");
      tbody.innerHTML = subscriptions
        .map((sub) => {
          const daysLeft = diffDaysFromToday(sub.dueDate);
          return `
            <tr>
              <td>${sub.name}</td>
              <td class="td-muted">${sub.category}</td>
              <td class="td-num">${formatDatePtBr(sub.dueDate)}</td>
              <td class="td-num">Vence em ${daysLeft} dias</td>
            </tr>
          `;
        })
        .join("");
    }

    const relatoriosBtn = document.getElementById("relatoriosBtn");
    const relatoriosMenu = document.getElementById("relatoriosMenu");

    relatoriosBtn.addEventListener("click", () => {
      const expanded = relatoriosBtn.getAttribute("aria-expanded") === "true";
      const next = !expanded;
      relatoriosBtn.setAttribute("aria-expanded", String(next));
      relatoriosMenu.classList.toggle("open", next);
    });

    const routeTitles = {
      "dashboard": "Visão Geral",
      "programas": "Programas de Fidelidade",
      "clubes": "Clubes & Assinaturas",
      "relatorios-rota-emissao": "Relatórios — Rota de Emissão",
      "relatorios-passagens": "Relatórios — Passagens",
      "relatorios-emitidos": "Relatórios — Emitidos",
      "relatorios-movimentos": "Relatórios — Movimentos"
    };

    document.querySelectorAll("[data-route]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".menu-btn, .submenu-btn").forEach((el) => el.classList.remove("active"));
        btn.classList.add("active");
        const route = btn.getAttribute("data-route");
        document.getElementById("mainTitle").textContent = routeTitles[route] || "Visão Geral";
      });
    });

    const bellTrigger = document.getElementById("bellTrigger");
    const alertsPanel = document.getElementById("alertsPanel");

    bellTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = alertsPanel.classList.toggle("open");
      bellTrigger.setAttribute("aria-expanded", String(isOpen));
    });

    document.addEventListener("click", (e) => {
      if (!alertsPanel.contains(e.target) && !bellTrigger.contains(e.target)) {
        alertsPanel.classList.remove("open");
        bellTrigger.setAttribute("aria-expanded", "false");
      }
    });

    renderTicker();
    renderExpiryCards();
    renderAlertsPanel();
    renderSubscriptionsTable();
  </script>
</body>
</html>
